  # Country Service
  country-service:
    build:
      context: ..
      dockerfile: services/country-service/Dockerfile
    container_name: military_index_country_service
    env_file:
      - ../.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      COUNTRY_SERVICE_PORT: 8082
      APP_ENV: development
    ports:
      - "${COUNTRY_SERVICE_PORT:-8082}:8082"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - military-index-network
    restart: unless-stopped

  # Technology Service
  technology-service:
    build:
      context: ..
      dockerfile: services/technology-service/Dockerfile
    container_name: military_index_technology_service
    env_file:
      - ../.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      TECHNOLOGY_SERVICE_PORT: 8081
      APP_ENV: development
    ports:
      - "${TECHNOLOGY_SERVICE_PORT:-8081}:8081"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - military-index-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: military_index_api_gateway
    env_file:
      - ../.env
    environment:
      API_GATEWAY_PORT: 8080
      TECHNOLOGY_SERVICE_URL: http://technology-service:8081
      COUNTRY_SERVICE_URL: http://country-service:8082
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      APP_ENV: development
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      - technology-service
      - country-service
    networks:
      - military-index-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  military-index-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: fd00::/80
